<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual AI Interviewer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>"
    />

    <!--
      The avatar rigs and the speech layer are classic scripts that attach
      themselves to `window`, kept exactly as they were rather than rewritten as
      modules: they are pure DOM/WebGL/Web-Speech code with no React in them, and
      they live in public/ and load before the bundle, so window.Avatar and
      window.Speech exist by the time React mounts.
      The 3D rig is NOT here: it needs three's glTF loaders, which are ES
      modules, so it lives in src/avatar/ and is bundled. It installs itself
      over this 2D rig once the bundle runs - which is also why the 2D one
      still loads first, as the fallback when WebGL is unavailable.
    -->
    <script src="/avatar.js"></script>
    <script src="/speech.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
